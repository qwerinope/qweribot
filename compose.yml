services:
  valkey:
    image: valkey/valkey:alpine
    container_name: valkey
    ports:
      - 6379:6379
    restart: no
    volumes:
      - ./db/redis:/data
    environment:
      - VALKEY_EXTRA_FLAGS=--save 60 1
  pocketbase:
    container_name: qweribot-pocketbase
    build:
      context: ./pocketbase
    ports:
      - 8090:8090
    restart: no
    volumes:
      - ./db/pocketbase:/pb/pb_data
